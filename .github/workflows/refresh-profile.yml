name: Refresh public profile

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Generate contribution snake
        # Platane/snk svg-only v3, pinned to the reviewed version.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#087e72&color_dots=#edf2f7,#b9e7d6,#78d3b6,#39ad8b,#087e72
            assets/snake-dark.svg?palette=github-dark&color_snake=#87aaff&color_dots=#17293b,#23515a,#327d7c,#4bb9a5,#6be4c1
      - name: Commit updated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity.svg assets/recent-projects.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public profile metadata"
          git push
